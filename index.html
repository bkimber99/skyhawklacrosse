<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salem Hills Lacrosse</title>
  <meta name="description" content="Official Site of Salem Hills Lacrosse" />
  <link rel="icon" type="image/png" href="./skyhawk-favicon-v3.png" />
  <style>
    :root {
      --navy: #0C2340;
      --sky: #7BA4DB;
      --white: #FFFFFF;
      --gold: #B3A369;
      --ink: #08172c;
      --line: rgba(255, 255, 255, 0.12);
      --muted: rgba(255, 255, 255, 0.68);
    }

    * { box-sizing: border-box; }

    html { background: var(--ink); }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top, rgba(123, 164, 219, 0.16), transparent 35%),
        linear-gradient(180deg, #102c4e 0%, var(--navy) 45%, var(--ink) 100%);
      background-attachment: fixed;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ---------- Schedule ribbon ---------- */

    .ribbon {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: stretch;
      background: rgba(8, 23, 44, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .ribbon[hidden] { display: none; }

    .ribbon-label {
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      line-height: 1.15;
    }

    .ribbon-viewport {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    }

    .ribbon-track {
      display: flex;
      width: max-content;
      animation: ribbon-scroll var(--ribbon-duration, 60s) linear infinite;
    }

    .ribbon:hover .ribbon-track,
    .ribbon:focus-within .ribbon-track { animation-play-state: paused; }

    @keyframes ribbon-scroll {
      to { transform: translateX(-50%); }
    }

    .game-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-right: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    .game-chip:hover { background: rgba(123, 164, 219, 0.12); }

    .chip-date {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
    }

    .chip-month {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--sky);
    }

    .chip-day {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .logo-badge {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--white);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
    }

    .logo-badge img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .logo-badge .initial {
      color: var(--navy);
      font-weight: 800;
    }

    .ha {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 999px;
    }

    .ha.home { background: var(--sky); color: var(--navy); }
    .ha.away { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1.5px var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      .ribbon-track { animation: none; }
      .ribbon-viewport { overflow-x: auto; mask-image: none; }
    }

    /* ---------- Tabs ---------- */

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px 16px 0;
    }

    .tab {
      padding: 9px 20px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .tab:hover { color: var(--white); }

    .tab[aria-current="page"] {
      color: var(--navy);
      background: var(--white);
    }

    .panel {
      flex: 1;
      width: 100%;
      padding: 24px 16px 48px;
    }

    .panel[hidden] { display: none !important; }

    /* ---------- Home ---------- */

    #panel-home {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .wrap {
      width: min(100%, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .logo {
      width: min(100%, 760px);
      height: auto;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.35));
    }

    .headline {
      margin: 0;
      font-size: clamp(1.25rem, 2vw + 0.9rem, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--white);
    }

    .accent {
      width: 96px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sky), var(--gold));
      opacity: 0.95;
    }

    /* ---------- Schedule tab ---------- */

    .schedule {
      width: min(100%, 860px);
      margin: 0 auto;
    }

    .schedule h2 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2vw + 1rem, 2rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .schedule .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .schedule .sub a { color: var(--sky); }

    .game-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-row {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      grid-template-areas:
        "date opp ha"
        "date info info";
      gap: 6px 14px;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .game-row.past { opacity: 0.5; }

    .row-date {
      grid-area: date;
      text-align: center;
      line-height: 1.1;
      padding-right: 14px;
      border-right: 1px solid var(--line);
    }

    .row-date .dow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sky);
    }

    .row-date .md {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .row-opp {
      grid-area: opp;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .row-opp .prefix {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .region {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .row-ha { grid-area: ha; }

    .row-info {
      grid-area: info;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .row-info a {
      color: var(--sky);
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .row-info a:hover { text-decoration: underline; }

    .row-info strong { color: var(--white); font-weight: 600; }

    @media (max-width: 520px) {
      .game-row {
        grid-template-columns: 60px minmax(0, 1fr) auto;
        padding: 12px;
        gap: 6px 10px;
      }
      .row-date { padding-right: 10px; }
      .row-opp { font-size: 0.95rem; gap: 8px; }
      .row-opp .logo-badge { width: 32px; height: 32px; }
      .row-info { flex-direction: column; }
    }
  </style>
</head>

    /* SCHEDULE_DATA:END */

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    function parseDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function logoBadge(game) {
      const badge = el("span", { class: "logo-badge" });
      if (game.logo) {
        badge.append(el("img", { src: game.logo, alt: game.opponent, loading: "lazy" }));
      } else {
        badge.append(el("span", { class: "initial", text: game.opponent[0], "aria-hidden": "true" }));
      }
      return badge;
    }

    function homeAway(game) {
      return el("span", { class: `ha ${game.home ? "home" : "away"}`, text: game.home ? "Home" : "Away" });
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const isPast = (game) => parseDate(game.date) < today;

    function buildRibbon() {
      const upcoming = SCHEDULE.filter((g) => !isPast(g));
      if (!upcoming.length) return;

      const ribbon = document.getElementById("ribbon");
      const track = document.getElementById("ribbon-track");
      const chip = (game) => {
        const date = parseDate(game.date);
        return el("a", {
          class: "game-chip",
          href: "#schedule",
          title: `${game.home ? "vs" : "at"} ${game.opponent}, ${MONTHS[date.getMonth()]} ${date.getDate()}`,
        }, [
          el("span", { class: "chip-date" }, [
            el("span", { class: "chip-month", text: MONTHS[date.getMonth()].toUpperCase() }),
            el("span", { class: "chip-day", text: String(date.getDate()) }),
          ]),
          logoBadge(game),
          homeAway(game),
        ]);
      };

      ribbon.hidden = false;
      // Repeat the games until one copy is wider than the screen, then render
      // that copy twice so the -50% scroll loops seamlessly.
      const copy = [];
      do {
        upcoming.forEach((g) => { const c = chip(g); copy.push(c); track.append(c); });
      } while (track.scrollWidth < window.innerWidth && copy.length < 200);
      copy.forEach((c) => {
        const clone = c.cloneNode(true);
        clone.setAttribute("aria-hidden", "true");
        clone.tabIndex = -1;
        track.append(clone);
      });
      // Constant speed (~40px/s) no matter how many games there are.
      track.style.setProperty("--ribbon-duration", `${Math.round(track.scrollWidth / 2 / 40)}s`);
    }

    function buildSchedule() {
      const list = document.getElementById("game-list");
      if (SCHEDULE_SEASON) {
        const endYear = SCHEDULE_SEASON.split("-")[1];
        document.getElementById("schedule-title").textContent = `20${endYear} Varsity Schedule`;
      }
      if (!SCHEDULE.length) {
        list.append(el("li", { class: "sub", text: "Schedule coming soon." }));
        return;
      }
      for (const game of SCHEDULE) {
        const date = parseDate(game.date);
        const venue = game.venue || {};
        const mapsUrl = venue.address
          ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${venue.name} ${venue.address}`)}`
          : null;

        const info = el("div", { class: "row-info" }, [
          el("span", {}, [el("strong", { text: game.time === "TBA" ? "Time TBA" : game.time.replace(/(am|pm)$/i, " $1").toUpperCase() })]),
        ]);
        if (venue.name) {
          info.append(mapsUrl
            ? el("a", { href: mapsUrl, target: "_blank", rel: "noopener", text: `${venue.name} · ${venue.address}` })
            : el("span", { text: venue.name }));
        }

        const name = el("span", {}, [
          el("span", { class: "prefix", text: game.home ? "vs " : "@ " }),
          game.opponent,
        ]);
        const oppText = el("span", {}, [name]);
        if (game.region) oppText.append(el("div", { class: "region", text: "Region" }));

        list.append(el("li", { class: `game-row${isPast(game) ? " past" : ""}` }, [
          el("div", { class: "row-date" }, [
            el("div", { class: "dow", text: DAYS[date.getDay()] }),
            el("div", { class: "md", text: `${date.getMonth() + 1}/${date.getDate()}` }),
          ]),
          el("div", { class: "row-opp" }, [logoBadge(game), oppText]),
          el("div", { class: "row-ha" }, [homeAway(game)]),
          info,
        ]));
      }
    }

    function showTab() {
      const current = location.hash === "#schedule" ? "schedule" : "home";
      for (const tab of document.querySelectorAll("[data-tab]")) {
        const active = tab.dataset.tab === current;
        if (active) tab.setAttribute("aria-current", "page");
        else tab.removeAttribute("aria-current");
        document.getElementById(`panel-${tab.dataset.tab}`).hidden = !active;
      }
    }

    // Panels are id'd "panel-*" so the #hash never matches an element and the
    // browser doesn't jump-scroll to it.
    window.addEventListener("hashchange", () => {
      showTab();
      window.scrollTo({ top: 0 });
    });

    buildRibbon();
    buildSchedule();
    showTab();
  </script>
</body>
</html>
